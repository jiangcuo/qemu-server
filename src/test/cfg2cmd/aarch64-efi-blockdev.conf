# TEST: aarch64 virt machine with EFI disk, SCSI disk and CD-ROM using -blockdev
arch: aarch64
bios: ovmf
cores: 2
efidisk0: local:100/vm-100-disk-0.qcow2,efitype=4m,size=528K
ide2: none,media=cdrom
kvm: 0
memory: 2048
ostype: l26
scsi0: local:100/vm-100-disk-1.qcow2,discard=on,iothread=1,size=32G
scsihw: virtio-scsi-single
